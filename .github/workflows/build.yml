name: build

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Clone
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --depth 1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$GITHUB_REF"
          git checkout -q FETCH_HEAD

      - name: Build
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
          docker build --pull --no-cache \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "ghcr.io/${GITHUB_REPOSITORY,,}:latest" .

      - name: Test
        run: |
          docker run --rm "$IMAGE" sh -c '
            set -e
            ./bin/Runner.Listener --version
            docker --version
            docker buildx version
            gh --version
            uv --version
            bun --version
            bunx --version
            go version
            sqlite3 --version
            rustc --version
            cargo clippy --version
            cargo fmt --version
            cc --version
            shasum --version
            bsdtar --version
            node --version
            zig version
            helm version
            sccache --version
          '

      - name: Push
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE"
